name: Android Release Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/release-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    name: Unit tests, minified APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository intentionally ships without gradle-wrapper.jar.
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run complete unit test suite
        run: timeout 18m gradle --no-daemon --console=plain testDebugUnitTest --stacktrace

      - name: Build minified release APK
        run: timeout 8m gradle --no-daemon --console=plain assembleRelease --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Build minified release App Bundle
        run: timeout 8m gradle --no-daemon --console=plain bundleRelease --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload unsigned release validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pianova-release-validation-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
