name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository intentionally ships without gradle-wrapper.jar, so CI
      # installs a fixed, AGP-compatible Gradle version explicitly.
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure per-test diagnostic logging
        shell: bash
        run: |
          cat > /tmp/pianova-test-logging.gradle <<'EOF'
          allprojects {
            tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
              testLogging {
                events "started", "passed", "failed", "skipped"
                showStandardStreams = true
              }
            }
          }
          EOF

      # Run the new evaluator tests separately with a hard bound. This reveals
      # the last test started if a coroutine-based test ever stalls.
      - name: Run EvaluationEngine tests
        run: timeout 7m gradle --init-script /tmp/pianova-test-logging.gradle --no-daemon --console=plain testDebugUnitTest --tests 'ir.pianova.app.domain.evaluation.EvaluationEngineTest' --info --stacktrace

      # Keep input, parser, and lesson-navigation logic isolated from the
      # evaluator suite while still running every unit test class explicitly.
      - name: Run MIDI, lesson parser, and lesson navigation tests
        run: timeout 7m gradle --init-script /tmp/pianova-test-logging.gradle --no-daemon --console=plain testDebugUnitTest --tests 'ir.pianova.app.core.midi.VirtualKeyboardInputTest' --tests 'ir.pianova.app.data.lesson.JsonLessonParserTest' --tests 'ir.pianova.app.domain.lesson.LessonProgressTest' --tests 'ir.pianova.app.domain.progress.LearnerProgressAggregatorTest' --tests 'ir.pianova.app.PracticeSessionClockTest' --tests 'ir.pianova.app.data.persistence.PianovaDatabaseTest' --tests 'ir.pianova.app.data.persistence.LearningPathRepositoryTest' --tests 'ir.pianova.app.domain.learning.LearningPathCatalogTest' --tests 'ir.pianova.app.data.persistence.LearnerSessionStoreTest' --tests 'ir.pianova.app.data.lesson.SkillAttemptStoreTest' --tests 'ir.pianova.app.LearnerSelectionScreenTest' --tests 'ir.pianova.app.domain.progress.FamilyProgressReportTest' --tests 'ir.pianova.app.FamilyProgressReportsScreenTest' --tests 'ir.pianova.app.data.backup.FamilyBackupCodecTest' --tests 'ir.pianova.app.data.lesson.BundledLessonContentTest' --tests 'ir.pianova.app.data.lesson.AudienceContentTest' --tests 'ir.pianova.app.core.voice.LessonNarrationTextTest' --tests 'ir.pianova.app.core.voice.LessonVoiceEngineTest' --info --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon --console=plain assembleDebug --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pianova-debug-b${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
